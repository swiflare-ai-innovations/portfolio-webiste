<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Brand colors: Orchid to Magenta Gradient -->
    <linearGradient id="lotus-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A2A9A" />
      <stop offset="60%" stop-color="#BA4ABA" />
      <stop offset="100%" stop-color="#FFA726" /> <!-- Golden orange for 'Kanaga' (gold) -->
    </linearGradient>
    
    <!-- Base Womb/Cradle Gradient -->
    <linearGradient id="base-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#221A28" />
      <stop offset="100%" stop-color="#9A2A9A" />
    </linearGradient>

    <!-- Subtle Drop Shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#221A28" flood-opacity="0.12" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Outer Petals (Background Layer) -->
    <path d="M50,80 C32,80 18,68 18,52 C18,44 24,37 30,34 C28,45 35,62 50,80 Z" fill="url(#lotus-grad)" opacity="0.8" />
    <path d="M50,80 C68,80 82,68 82,52 C82,44 76,37 70,34 C72,45 65,62 50,80 Z" fill="url(#lotus-grad)" opacity="0.8" />
    
    <!-- Inner Petals (Middle Layer) -->
    <path d="M50,80 C38,80 26,68 28,48 C29,38 36,28 42,24 C38,38 43,60 50,80 Z" fill="url(#lotus-grad)" opacity="0.95" />
    <path d="M50,80 C62,80 74,68 72,48 C71,38 64,28 58,24 C62,38 57,60 50,80 Z" fill="url(#lotus-grad)" opacity="0.95" />
    
    <!-- Center Petal (Foreground Layer) -->
    <path d="M50,80 C44,65 42,45 50,15 C58,45 56,65 50,80 Z" fill="url(#lotus-grad)" />

    <!-- Bottom cradle representing support, womb, and new life -->
    <path d="M15,55 C30,78 70,78 85,55 C72,62 60,65 50,65 C40,65 28,62 15,55 Z" fill="url(#base-grad)" />
    
    <!-- Golden particles representing fertility, life, and Lakshmi's blessings -->
    <circle cx="50" cy="9" r="2.5" fill="#FFA726" />
    <circle cx="41" cy="18" r="1.5" fill="#FFA726" opacity="0.8" />
    <circle cx="59" cy="18" r="1.5" fill="#FFA726" opacity="0.8" />
  </g>
</svg>
